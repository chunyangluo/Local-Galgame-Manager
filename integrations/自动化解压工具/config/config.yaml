app:
  host: "0.0.0.0"
  port: 9600
  api_key: ""

directories:
  watch: ""
  target: ""
  archive: ""
  failed: ""
  temp: ""
  logs: "./data/logs"
  upload: ""
  game_save: ""

seven_zip:
  path: "./bin/7za.exe"

passwords:
  file: "./config/passwords.json"
  encrypt: false
  encryption_key: ""

watcher:
  debounce_seconds: 3
  stable_check_interval: 0.5
  stable_threshold: 2
  ignore_suffixes:
    - ".baiduyun.p.downloading"
    - ".baiduyun.downloading"
    - ".baiduyun.downloading.cfg"
    - ".uploading"
    - ".baiduyun.uploading"
    - ".tmp"
    - ".bd!"
    - ".part"
    - ".pcs"

extraction:
  max_recursive_depth: 4
  enable_magic_detection: true
  default_target_dir: ""

post_process:
  enabled: true
  move_game_dir: true
  delete_archive: false
  iso_images:
    enabled: true
    try_mount_fallback: true
    move_iso_to_subfolder: true
    disc_subfolder: "_disc_images"
  game_detection:
    enabled: true
    keywords:
      - "game"
      - "Game"
      - "游戏"
      - "汉化"
      - "中文"
      - "pc"
      - "PC"
      - "steam"
      - "Steam"
      - "visual novel"
      - "Visual Novel"
      - "galgame"
      - "Galgame"
    min_size_mb: 200

logging:
  level: "INFO"
  rotation: "00:00"
  retention: "0 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"

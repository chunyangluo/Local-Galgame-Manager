app:
  host: "0.0.0.0"
  port: 9600
  api_key: ""

directories:
  watch: "D:\\Download\\galgame"
  target: "D:\\Download\\galgame\\_extract"
  archive: "D:\\Download\\galgame\\_archive"
  failed: "D:\\Download\\galgame\\_failed"
  temp: "D:\\Download\\galgame\\_temp"
  logs: "./data/logs"
  upload: "D:\\Download\\galgame\\_upload"
  game_save: "E:\\private\\galgame"

seven_zip:
  path: "./bin/7za.exe"

passwords:
  file: "./config/passwords.json"
  encrypt: false
  encryption_key: ""

watcher:
  debounce_seconds: 3
  stable_check_interval: 0.5
  stable_threshold: 2
  ignore_suffixes:
    - ".baiduyun.p.downloading"
    - ".baiduyun.downloading"
    - ".baiduyun.downloading.cfg"
    - ".uploading"
    - ".baiduyun.uploading"
    - ".tmp"
    - ".bd!"
    - ".part"
    - ".pcs"

extraction:
  max_recursive_depth: 4
  enable_magic_detection: true
  default_target_dir: ""

post_process:
  enabled: true
  move_game_dir: true
  delete_archive: false
  game_detection:
    enabled: true
    keywords:
      - "game"
      - "Game"
      - "游戏"
      - "汉化"
      - "中文"
      - "pc"
      - "PC"
      - "steam"
      - "Steam"
      - "visual novel"
      - "Visual Novel"
      - "galgame"
      - "Galgame"
    min_size_mb: 200

logging:
  level: "INFO"
  rotation: "00:00"
  retention: "0 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"

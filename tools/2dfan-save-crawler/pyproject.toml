[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfan-save-crawler"
version = "0.1.0"
description = "Crawl 2dfan.com download pages for save-location hints into SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
cf = ["curl_cffi>=0.7.0"]

[project.scripts]
dfan-save-crawler = "dfan_save_crawler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
